      <style>
                body { margin: 0; padding: 30px; background: #f5f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
                h1 { text-align: center; margin: 0 0 6px 0; font-size: 1.6rem; color: #1a1a2e; }
                .subtitle { text-align: center; color: #666; margin: 0 0 30px 0; font-size: 0.95rem; }
                .legend { display: flex; justify-content: center; gap: 30px; margin-bottom: 24px; }
                .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 500; }
                .legend-color { width: 20px; height: 14px; border-radius: 3px; }
                .chart-container { background: #f0fdff; border-radius: 12px; padding: 30px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
                .gantt { position: relative; min-width: 900px; }
