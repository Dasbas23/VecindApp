                .sprint-name { font-weight: 700; font-size: 0.95rem; color: #1a1a2e; }
                .sprint-desc { font-size: 0.72rem; color: #11056f; margin-top: 2px; line-height: 1.3; }
                .bars-area { flex: 1; position: relative; min-height: 56px; }
                .bar { position: absolute; height: 22px; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 0.68rem; font-weight: 600; color: #1a1a2e; white-space: nowrap; }
                .bar.planned { top: 4px; background: #b3d4f7; }
                .bar.actual { top: 30px; background: #a8e6c1; }
                .grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: #f0f0f0; }
                .separator { margin-left: 200px; height: 1px; background: #f0f0f0; margin-bottom: 6px; }
                .bar-date { font-size: 0.6rem; opacity: 0.9; margin-left: 4px; }
                .summary { display: none; }
            </style>
