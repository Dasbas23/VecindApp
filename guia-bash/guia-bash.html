<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ====== HEAD ====== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía Bash</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!-- ====== MARKUP: HEADER ====== -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <h1 class="text-2xl font-bold">Guía Bash</h1>
      <p class="text-sm text-slate-600">Iteraciones 1–3: búsqueda, manipulación, scripting completo.</p>
    </div>
  </header>

  <!-- ====== MARKUP: FILTERS ====== -->
  <section class="max-w-6xl mx-auto px-4 py-4 space-y-3">
    <input
      id="search-input"
      type="search"
      placeholder="Buscar (nombre, descripción, tags)..."
      class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500"
    />
    <div class="flex flex-wrap gap-3 items-center">
      <label class="text-sm">
        Categoría:
        <select id="filter-categoria" class="ml-1 border border-slate-300 rounded px-2 py-1 text-sm">
          <option value="all">Todas</option>
          <option value="busqueda-archivos">Búsqueda de archivos</option>
          <option value="busqueda-contenido">Búsqueda de contenido</option>
          <option value="manipulacion-archivos">Manipulación de archivos</option>
          <option value="compresion">Compresión</option>
          <option value="permisos">Permisos</option>
          <option value="variables">Variables</option>
          <option value="control-flujo">Control de flujo</option>
          <option value="funciones-y-scripting">Funciones y scripting</option>
        </select>
      </label>
      <label class="text-sm">
        Dificultad:
        <select id="filter-dificultad" class="ml-1 border border-slate-300 rounded px-2 py-1 text-sm">
          <option value="all">Todas</option>
          <option value="basico">Básico</option>
          <option value="intermedio">Intermedio</option>
          <option value="avanzado">Avanzado</option>
        </select>
      </label>
      <label class="text-sm">
        Tipo:
        <select id="filter-tipo" class="ml-1 border border-slate-300 rounded px-2 py-1 text-sm">
          <option value="all">Todos</option>
          <option value="comando">Comando</option>
          <option value="operador">Operador</option>
          <option value="receta">Receta</option>
        </select>
      </label>
      <label class="text-sm flex items-center gap-1">
        <input id="filter-gitbash" type="checkbox" class="rounded border-slate-300">
        Compatible con Git Bash
      </label>
      <button id="filter-clear" class="ml-auto text-sm text-sky-700 underline hover:text-sky-900">
        Limpiar filtros
      </button>
    </div>
  </section>

  <!-- ====== MARKUP: GRID ====== -->
  <main id="grid" class="max-w-6xl mx-auto px-4 pb-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></main>

  <!-- ====== MARKUP: EMPTY STATE ====== -->
  <div id="empty-state" class="max-w-6xl mx-auto px-4 py-12 text-center text-slate-500 hidden">
    <p class="text-lg mb-2">Ningún comando coincide con estos filtros.</p>
    <button id="empty-state-clear" class="text-sky-700 underline hover:text-sky-900">Limpiar filtros</button>
  </div>

  <!-- ====== MARKUP: TEST BANNER (debug) ====== -->
  <div id="test-banner" class="max-w-6xl mx-auto px-4 py-2 text-sm font-mono"></div>

  <script>
    // ====== JS: TEST INFRA ======
    const __TEST_RESULTS = { passed: 0, failed: [] };

    function assert(cond, msg) {
      if (!cond) {
        __TEST_RESULTS.failed.push(msg);
        console.error('FAIL:', msg);
      } else {
        __TEST_RESULTS.passed++;
      }
    }

    function renderTestBanner() {
      const banner = document.getElementById('test-banner');
      if (__TEST_RESULTS.failed.length === 0) {
        banner.className = 'max-w-6xl mx-auto px-4 py-2 text-sm font-mono bg-emerald-50 text-emerald-800 border border-emerald-200 rounded mt-2';
        banner.textContent = `✓ ${__TEST_RESULTS.passed} tests OK`;
      } else {
        banner.className = 'max-w-6xl mx-auto px-4 py-2 text-sm font-mono bg-rose-50 text-rose-800 border border-rose-300 rounded mt-2';
        banner.innerHTML = `✗ ${__TEST_RESULTS.failed.length} test(s) FALLAN (${__TEST_RESULTS.passed} OK):<br>` +
          __TEST_RESULTS.failed.map(f => `&nbsp;&nbsp;• ${f}`).join('<br>');
      }
    }

      ,{
        id: 'chmod',
        tipo: 'comando',
        nombre: 'chmod',
        categoria: 'permisos',
        dificultad: 'intermedio',
        descripcion: 'Cambia los permisos de un archivo o directorio.',
        gitbash: 'caveats',
        patron: 'chmod [opciones] MODO ARCHIVO...',
        tags: ['permisos', 'octal', 'simbolico'],
        modelo_mental: 'Los permisos POSIX son tres triadas — dueño / grupo / otros — cada una con tres bits: r (4), w (2), x (1). chmod acepta DOS notaciones: octal (sumas de 4/2/1 por triada, p.ej. 755 = rwxr-xr-x) y simbólica (`u+x`, `g-w`, `o=r`, `a+rw` donde u=user, g=group, o=others, a=all). Para directorios, x significa "permiso para entrar" (no ejecutar).',
        ejemplos: [
          { comando: 'chmod 755 script.sh',       explicacion: 'rwx para dueño, r-x para grupo y otros (típico de ejecutables).',          compat_notes: null },
          { comando: 'chmod 644 archivo.txt',     explicacion: 'rw- dueño, r-- resto (típico de archivos de datos).',                       compat_notes: null },
          { comando: 'chmod +x script.sh',        explicacion: 'Añade permiso de ejecución para todos (forma simbólica).',                  compat_notes: null },
          { comando: 'chmod u+x,g-w archivo',     explicacion: 'Dueño gana ejecución; grupo pierde escritura.',                              compat_notes: null },
          { comando: 'chmod -R 755 dir/',         explicacion: 'Aplica recursivamente a todo el árbol (cuidado: aplica el mismo modo a archivos Y directorios).', compat_notes: null }
        ],
        flags: [
          { flag: '-R',              descripcion: 'Recursivo: aplica a todo el árbol bajo el directorio.',                          compat_notes: null },
          { flag: '-v',              descripcion: 'Verbose: imprime cada cambio.',                                                  compat_notes: null },
          { flag: '-c',              descripcion: 'Como -v pero solo imprime los archivos efectivamente modificados.',             compat_notes: null },
          { flag: '--reference=REF', descripcion: 'Copia los permisos de REF al archivo destino.',                                  compat_notes: null }
        ],
        combos: [
          { comando: 'chmod -R u+rwX,go+rX,go-w dir/', explicacion: 'X mayúscula: aplica x SOLO a directorios y archivos ya ejecutables. Truco clásico para chmod -R en árboles mixtos.', compat_notes: null },
          { comando: 'chmod --reference=plantilla.txt nuevo.txt', explicacion: 'Copia permisos de un archivo modelo al nuevo.',                  compat_notes: null }
        ],
        gotchas: [
          'En la triada octal: r=4, w=2, x=1. 755 = 4+2+1 / 4+0+1 / 4+0+1 = rwxr-xr-x. 644 = 6/4/4 = rw-r--r--. 700 = solo dueño.',
          'Para directorios: x significa "puedo entrar (cd)"; r significa "puedo listar (ls)"; w significa "puedo crear/borrar archivos dentro". Un dir con r sin x permite ver nombres pero no acceder.',
          'En Git Bash y Windows: NTFS no usa el modelo POSIX exacto. chmod parece funcionar pero el sistema operativo respeta sus propios ACLs. El bit +x sobre un .sh sí permite "./script.sh" desde Git Bash.',
          'chmod -R 755 sobre un árbol mixto pone x en archivos de datos también (no deseable). Usar `chmod -R u+rwX,go+rX,go-w dir/` (X mayúscula) para aplicar x solo donde tiene sentido.',
          'El bit setuid (4xxx), setgid (2xxx) y sticky (1xxx) son una cuarta triada que precede a las tres habituales (chmod 4755 → rwsr-xr-x). Útil casi solo para sysadmin.'
        ],
        relacionados: ['chown', 'ls'],
        cuando_no_usar: 'Para gestión avanzada de permisos por usuario/grupo (más allá del modelo POSIX 3-triadas), usa ACLs con `setfacl`/`getfacl`. Para cambiar el dueño, no chmod sino `chown`.'
      }

        flags: [

          { flag: 't',           descripcion: 'List: muestra el contenido sin extraer.',                                                                  compat_notes: null },
          { flag: 'f ARCHIVO',   descripcion: 'File: usa ARCHIVO (debe ir inmediatamente antes del nombre del fichero).',                                compat_notes: null },
          { flag: 'z',           descripcion: 'gzip: comprime/descomprime con gzip (.tar.gz).',                                                          compat_notes: null },
          { flag: 'j',           descripcion: 'bzip2: comprime/descomprime con bzip2 (.tar.bz2). Mejor compresión, más lento.',                          compat_notes: null },

          { flag: 'v',           descripcion: 'Verbose: imprime cada archivo procesado.',                                                                compat_notes: null },
          { flag: '-C DIR',      descripcion: 'Cambia a DIR antes de operar (útil al extraer sin contaminar el cwd).',                                   compat_notes: null },

        ],
        combos: [

          { comando: 'tar czf out.tar.gz --exclude=.git --exclude=node_modules .', explicacion: 'Múltiples exclusiones para empaquetar el proyecto actual sin basura.',     compat_notes: null }
        ],
        gotchas: [
          'El orden de los flags importa: `f` debe ir inmediatamente antes del nombre del archivo. `tar czf out.tar.gz dir` ✓, `tar fcz out.tar.gz dir` ✗.',
          'Las extensiones (.tar, .tar.gz, .tgz, .tar.bz2, .tar.xz) son convencionales — tar no las infiere. Tienes que indicarle el modo de compresión con z/j/J explícitamente (versiones modernas detectan al extraer con `tar xf`, pero por costumbre se especifica).',
          'Sin -C, `tar xzf` extrae en el cwd. Si el tarball no tiene un directorio raíz único, te llena el cwd de archivos sueltos. Antes de extraer algo desconocido, listar con `tar tzf` y/o usar `-C /tmp/dir`.',
          '--exclude debe ir ANTES del directorio que se empaqueta (`tar czf out --exclude=node_modules proyecto/`). Después del directorio, no surte efecto en algunas versiones.',

      ,{
        id: 'sx-variables',
        tipo: 'sintaxis',
        nombre: 'Variables y expansion',
        categoria: 'variables',
        dificultad: 'basico',
        descripcion: 'Asignar y leer variables en bash. Incluye parameter expansion (defaults, prefix/suffix strip, length, slicing, reemplazo).',
        gitbash: 'ok',
        patron: 'NOMBRE=valor    /    $NOMBRE    /    ${NOMBRE}    /    ${NOMBRE:-default}',
        tags: ['variable', 'expansion', 'parameter'],
        modelo_mental: 'Las variables en bash son SIEMPRE strings (no hay tipos). Se asignan SIN espacios alrededor del = (`a=hola`, NO `a = hola` — eso es un comando). Se leen con `$nombre` o `${nombre}`. La forma `${...}` desbloquea operaciones extra: defaults `${V:-x}`, prefix strip `${V##*/}`, suffix strip `${V%.*}`, length `${#V}`, slice `${V:0:3}`, reemplazo `${V/foo/bar}`. Variables sin definir expanden a string vacío (peligroso — usar `set -u` o `${V:?error}` para fallar).',
        ejemplos: [
          { comando: 'nombre="Marius"',                  explicacion: 'Asignación. Sin espacios alrededor de =. Comillas opcionales si no hay espacios en el valor, pero recomendadas siempre.', compat_notes: null },
          { comando: 'echo "Hola $nombre"',              explicacion: 'Expansión simple. Las comillas dobles permiten expansión; las simples NO.',                                                  compat_notes: null },
          { comando: 'echo "${nombre}_sufijo"',          explicacion: '${} delimita el nombre cuando va pegado a más texto. Sin las llaves, `$nombre_sufijo` se interpretaría como otra variable.',  compat_notes: null },
          { comando: 'echo "${NOMBRE:-anónimo}"',        explicacion: 'Si NOMBRE no está definida o está vacía, usa "anónimo". No asigna; solo expande.',                                            compat_notes: null },
          { comando: 'archivo="/home/m/foto.jpg"; echo "${archivo##*/}"', explicacion: 'Elimina prefijo más largo que matchee */. Resultado: "foto.jpg" (basename).',                                  compat_notes: null },
          { comando: 'archivo="/home/m/foto.jpg"; echo "${archivo%.*}"',  explicacion: 'Elimina sufijo más corto que matchee .*. Resultado: "/home/m/foto".',                                         compat_notes: null },
          { comando: 'cadena="hola mundo"; echo "${#cadena}"',           explicacion: 'Length de la cadena. Resultado: 10.',                                                                          compat_notes: null },
          { comando: 'cadena="HOLA"; echo "${cadena,,}"',                explicacion: 'Bash 4+: convierte a minúsculas. `${V^^}` a mayúsculas.',                                                       compat_notes: null }
        ],
        combos: [
          { comando: 'cp "$archivo" "${archivo}.bak"',                          explicacion: 'Backup con sufijo. Las comillas dobles preservan espacios en nombres.',                          compat_notes: null },
          { comando: ': "${PORT:=3000}"; echo "$PORT"',                          explicacion: '`:=` asigna el default si la variable no estaba definida. El `:` al principio es un no-op.',     compat_notes: null },
          { comando: 'for f in *.JPG; do mv "$f" "${f%.JPG}.jpg"; done',         explicacion: 'Renombra masivo: quita sufijo .JPG y añade .jpg.',                                                 compat_notes: null }
        ],
        gotchas: [
          'SIN espacios alrededor del =. `a=1` ✓. `a = 1` ✗ (lo interpreta como ejecutar el comando "a" con args "=" y "1").',
          'Variables no definidas expanden a "" sin error. `rm -rf $UNDEFINED/datos` se vuelve `rm -rf /datos` — catastrófico. Usar `set -u` (errror en variables no definidas) o `${V:?msg}` para abortar.',
          'Comillas dobles preservan expansión; comillas simples NO. `echo "$HOME"` → `/home/x`; `echo \'$HOME\'` → `$HOME` literal.',
          'SIEMPRE entrecomillar variables al usarlas como argumentos: `cp "$src" "$dst"` (espacios en nombres no rompen).',
          'Diferencia `:-` (usa default sin asignar) vs `:=` (usa default Y asigna) vs `:?` (error si no definida) vs `:+` (usa valor alternativo si SÍ está definida).',
          '`${V##patron}` (greedy) vs `${V#patron}` (no greedy). Igual con `%%` vs `%`.'
        ],
        relacionados: ['sx-export', 'sx-read', 'sx-arrays', 'sx-special-vars'],
        cuando_no_usar: 'Para manipulación de texto compleja (parsear JSON, CSV, regex sofisticada), las variables y parameter expansion se quedan cortos. Usar `jq` (JSON), `awk` (columnar), Python, o pasar a un lenguaje real.'
      }

        ejemplos: [

          { comando: 'read -p "Tu edad: " edad',             explicacion: 'Imprime el prompt antes de leer (-p).',                                                    compat_notes: null },
          { comando: 'read -s -p "Password: " pwd',          explicacion: '-s = silent: no muestra lo escrito (típico para contraseñas).',                            compat_notes: null },
          { comando: 'read -t 5 valor || echo "timeout"',    explicacion: '-t 5 = timeout 5s; si no hay input, read devuelve != 0.',                                  compat_notes: null },
          { comando: 'read -n 1 -p "¿Sí/No? " respuesta',     explicacion: '-n 1 = lee solo 1 carácter (sin esperar Enter).',                                          compat_notes: null },
          { comando: 'while IFS= read -r line; do echo ">> $line"; done < datos.txt', explicacion: 'Iteración canónica línea a línea. IFS= preserva espacios; -r preserva backslashes.', compat_notes: null }
        ],
        flags: [
          { flag: '-p PROMPT', descripcion: 'Imprime PROMPT antes de leer (más cómodo que `echo -n` previo).',                          compat_notes: null },
          { flag: '-r',         descripcion: 'No interpretar `\\` como escape (preserva backslashes literales).',                       compat_notes: null },
          { flag: '-s',         descripcion: 'Silent: no echo de los caracteres escritos (passwords).',                                  compat_notes: null },
          { flag: '-t N',       descripcion: 'Timeout en N segundos. read devuelve código != 0 si expira.',                              compat_notes: null },
          { flag: '-n N',       descripcion: 'Lee hasta N caracteres sin esperar Enter.',                                                 compat_notes: null },
          { flag: '-a ARR',     descripcion: 'Asigna las palabras (split por IFS) a un array indexed.',                                  compat_notes: null },

        ],
        combos: [
          { comando: 'cat archivo | while IFS= read -r line; do echo "$line"; done', explicacion: 'CUIDADO: como esto crea un subshell para el while, variables modificadas dentro NO sobreviven. Mejor: redirigir el archivo con `< archivo` después del done.', compat_notes: null },
          { comando: 'IFS=: read -r usuario _ uid _ <<< "alice:x:1001:1001:Alice:/home/alice:/bin/bash"',     explicacion: 'Split por : con IFS local a este read. `<<<` es here-string.',                  compat_notes: null }
        ],
        gotchas: [
          'Sin `-r`, backslashes se interpretan: `\\n` se convierte en `n` literal, `\\\\` en `\\`. Casi siempre quieres `-r`.',
          'Sin `IFS=` (vacío) delante, read recorta espacios y tabs del principio/final de la línea. Si quieres fidelidad, `IFS=` siempre.',
          'En el patrón `cmd | while read ...`, el while corre en un subshell — variables modificadas dentro del while NO se ven fuera. Usar `while read ... done < archivo` (redirección, sin pipe) para evitarlo.',
          'En Git Bash, `read -s` funciona pero a veces no oculta perfectamente si el terminal es raro (mintty suele bien). Probar antes de usar para passwords reales.',
          'read devuelve != 0 cuando alcanza EOF (sin saltos al final). Patrón típico: el bucle while termina solo cuando EOF.'

      ,{
        id: 'sx-arrays',
        tipo: 'sintaxis',
        nombre: 'Arrays',
        categoria: 'variables',
        dificultad: 'intermedio',
        descripcion: 'Arrays indexed y asociativos en bash. Acceso a elementos, slicing, longitud, iteración.',
        gitbash: 'ok',
        patron: 'arr=(a b c)    /    arr[i]=x    /    "${arr[@]}"    /    "${#arr[@]}"',
        tags: ['array', 'lista', 'indexed', 'associative'],
        modelo_mental: 'Bash 4+ tiene dos tipos de array. Indexed (`declare -a` o asignación con paréntesis): índices son enteros desde 0. Associative (`declare -A`): índices son strings (mapa/diccionario). Acceso a un elemento: `${arr[i]}`. TODOS los elementos: `"${arr[@]}"` (palabras separadas, con comillas) o `"${arr[*]}"` (una sola palabra unida). Length: `${#arr[@]}`. La diferencia `@` vs `*` ENTRE COMILLAS es el gotcha clásico.',
        ejemplos: [
          { comando: 'arr=(uno dos tres)',                  explicacion: 'Declara array indexed con 3 elementos.',                                                       compat_notes: null },
          { comando: 'echo "${arr[1]}"',                    explicacion: 'Acceso por índice (base 0). Resultado: "dos".',                                                compat_notes: null },
          { comando: 'echo "${arr[@]}"',                    explicacion: 'Todos los elementos. Entre comillas: cada uno es una palabra separada (preserva espacios).',  compat_notes: null },
          { comando: 'echo "${#arr[@]}"',                   explicacion: 'Cantidad de elementos: 3.',                                                                    compat_notes: null },
          { comando: 'arr+=(cuatro)',                       explicacion: 'Append. arr ahora tiene 4 elementos.',                                                          compat_notes: null },
          { comando: 'unset arr[1]',                        explicacion: 'Borra el elemento de índice 1 (deja "hueco" — índices no se renumeran).',                       compat_notes: null },
          { comando: 'for x in "${arr[@]}"; do echo "$x"; done', explicacion: 'Itera correctamente sobre los elementos (incluso con espacios).',                          compat_notes: null },
          { comando: 'declare -A user=([nombre]="Marius" [edad]=42); echo "${user[nombre]}"', explicacion: 'Array asociativo (clave string). Requiere declare -A antes.', compat_notes: null }
        ],
        combos: [
          { comando: 'archivos=( *.txt ); echo "Total: ${#archivos[@]}"',   explicacion: 'Glob expandido en array. Cuidado: si no matchea nada, queda con 1 elemento literal "*.txt".', compat_notes: null },
          { comando: 'IFS=$\'\\n\' read -d \'\' -ra lineas < archivo',       explicacion: 'Lee todo el archivo en un array de líneas. Alternativa moderna: `mapfile -t lineas < archivo`.', compat_notes: null }
        ],
        gotchas: [
          '"${arr[@]}" (con comillas) → cada elemento como palabra separada. "${arr[*]}" (con comillas) → todos unidos por el primer char de IFS. SIN comillas: ambos hacen word splitting. La regla: casi siempre `"${arr[@]}"`.',
          'Los arrays asociativos requieren `declare -A nombre` ANTES de asignar. Si no, bash trata las claves string como aritmética → 0.',
          '`arr=(*.txt)` con glob sin matches: NO queda vacío, queda con un solo elemento literal `*.txt` (a menos que actives `shopt -s nullglob`).',
          '`unset arr[i]` borra el elemento pero NO renumera índices. `${#arr[@]}` da el conteo correcto, pero hay un "hueco" — iterar por índice numérico puede saltarse posiciones.',
          'En Git Bash, los arrays funcionan bien (bash 4+). Cuidado: copy-paste de scripts antiguos con sh puede fallar — los arrays son bash, no POSIX.'
        ],

        cuando_no_usar: 'Para datos complejos (records con muchos campos, anidados), bash arrays se quedan cortos. Considerar Python, jq (JSON), o leer en variables individuales si son pocos.'

      ,{

          { comando: 'if [[ "$nombre" == "alice" ]]; then echo "hola"; fi',    explicacion: 'Comparación string con `[[ ]]` (recomendado en bash).',     compat_notes: null },
          { comando: 'if grep -q ERROR app.log; then echo "hay errores"; fi',  explicacion: 'Condición = exit code de grep. `-q` silencia output, solo informa éxito/fallo.', compat_notes: null },
          { comando: 'if ! command -v jq >/dev/null; then echo "jq no instalado"; exit 1; fi', explicacion: 'Negación con `!`. Comprueba si un comando NO existe.', compat_notes: null },
          { comando: 'if [ -f config.yml ]; then echo "existe"; elif [ -f config.yaml ]; then echo "existe (yaml)"; else echo "no"; fi', explicacion: 'Cadena if/elif/else con tests de archivo.', compat_notes: null }

      ,{
        id: 'sx-tests',
        tipo: 'sintaxis',
        nombre: '[ ] vs [[ ]] (tests)',
        categoria: 'control-flujo',
        dificultad: 'intermedio',
        descripcion: 'Las dos sintaxis de test en bash: `[ ]` (POSIX, portable) y `[[ ]]` (bashism, más potente y seguro).',
        gitbash: 'ok',
        patron: '[ EXPR ]    o    [[ EXPR ]]',
        tags: ['test', 'condicional', 'comparacion'],
        modelo_mental: '`[ ]` es un comando real (`/usr/bin/[` o builtin) — necesita espacios alrededor de operandos, comillas para variables, y `\\&&` o `-a`/`-o` para combinar (deprecado). `[[ ]]` es palabra reservada del shell — parser especial: NO necesita comillas en variables, acepta `&&`/`||` directos, soporta regex con `=~` y glob matching. **Regla práctica:** usa `[[ ]]` salvo que necesites portabilidad POSIX explícita (scripts `sh`/`dash`).',
        ejemplos: [
          { comando: '[ "$x" = "hola" ]',           explicacion: 'POSIX: igualdad de string. `=` o `==`. Comillas obligatorias en $x.',           compat_notes: null },
          { comando: '[[ $x == "hola" ]]',          explicacion: 'Bash: lo mismo sin comillas en $x (parser bash lo entiende).',                  compat_notes: null },
          { comando: '[[ $email =~ ^[a-z]+@[a-z]+\\.[a-z]+$ ]]', explicacion: 'Bash exclusivo: regex con `=~`. La regex va sin comillas.',           compat_notes: null },
          { comando: '[[ $archivo == *.log ]]',     explicacion: 'Bash: glob matching dentro del test (no funciona con `[ ]`).',                  compat_notes: null },
          { comando: '[ -f archivo.txt ]',          explicacion: 'Test de archivo: -f existe Y es regular. -d dir, -L symlink, -e existe (cualquiera).', compat_notes: null },
          { comando: '[ "$n" -gt 10 ]',              explicacion: 'Comparación NUMÉRICA en POSIX: -eq, -ne, -lt, -le, -gt, -ge (NO `>` ni `<` aquí).', compat_notes: null },
          { comando: '[[ $n -gt 10 && $n -lt 100 ]]', explicacion: 'Bash: combinar con `&&` directo dentro del [[ ]].',                              compat_notes: null }
        ],
        flags: [
          { flag: '-eq / -ne / -lt / -le / -gt / -ge', descripcion: 'Comparación numérica (== != < <= > >=). Funciona en [ ] y [[ ]].',                compat_notes: null },
          { flag: '= / == / !=',                       descripcion: 'Comparación de string. En [ ] usar `=`. En [[ ]] `==` y `=` ambos válidos.',     compat_notes: null },
          { flag: '-f / -d / -e / -L / -r / -w / -x',  descripcion: 'Tests de archivo: -f regular, -d directorio, -e existe (cualquier tipo), -L symlink, -r/-w/-x permisos.', compat_notes: null },
          { flag: '-z / -n',                            descripcion: '-z STRING: cierto si string vacío. -n STRING: cierto si NO vacío.',              compat_notes: null },
          { flag: '=~',                                 descripcion: 'BASH ONLY (solo en [[ ]]): match con regex extendida (ERE).',                    compat_notes: null }
        ],
        combos: [
          { comando: '[[ -f "$f" && -r "$f" ]] && echo "legible"', explicacion: 'Combinar tests con `&&` directo dentro de [[ ]].',                           compat_notes: null },
          { comando: 'if [[ -z "$VAR" ]]; then echo "vacía o no definida"; fi', explicacion: 'Comprobar variable vacía O no definida.',                       compat_notes: null }
        ],
        gotchas: [
          'En `[ ]`: SIEMPRE entrecomillar variables. `[ $x = y ]` con x="" se convierte en `[ = y ]` → error de sintaxis. `[ "$x" = "y" ]` no rompe.',
          'En `[ ]`: usar `-eq` para números, `=` para strings. `[ "1" -eq "01" ]` → true (numéricos). `[ "1" = "01" ]` → false (strings).',
          'En `[ ]`: `<` y `>` NO son comparación numérica, son redirección de archivos. Usar `-lt`/`-gt`.',
          'En `[[ ]]`: `==` con globs hace matching, no igualdad: `[[ "abc" == a* ]]` → true. Para igualdad estricta de string, entrecomillar el patrón: `[[ "abc" == "a*" ]]` → false.',
          'En `[[ ]]`: regex `=~` debe ir SIN comillas en el patrón. `[[ "$s" =~ "^[0-9]+$" ]]` (con comillas) interpreta el patrón como literal — busca el texto `^[0-9]+$` dentro de $s.',
          '`[[ ]]` NO es POSIX. Scripts con `#!/bin/sh` que usen `[[ ]]` fallarán en sistemas donde sh = dash (Debian/Ubuntu).'

        relacionados: ['sx-if', 'sx-while'],
        cuando_no_usar: 'Para condiciones aritméticas puras (sin tests de archivo ni strings), `(( ))` es más limpio: `if (( n > 10 )); then ...`. Para matching complejo o múltiples ramas, `case` puede ser más legible que cadenas de `[[ ... ]]`.'
      }
      ,{

        nombre: 'Funciones',

          { comando: 'es_par() { (( $1 % 2 == 0 )); }; if es_par 4; then echo "sí"; fi', explicacion: 'Devolver éxito/fallo: el último exit code del cuerpo es el de la función. `(( ))` da 0 si la expresión es verdadera.', compat_notes: null },
          { comando: 'incrementar() { local i=$1; i=$((i+1)); echo "$i"; }; incrementar 10', explicacion: '`local` evita modificar variables del scope exterior. Output: 11.', compat_notes: null },
          { comando: 'log() { echo "[$(date +%H:%M:%S)] $*"; }; log "evento importante"', explicacion: '$* (o $@) accede a TODOS los argumentos. Útil para wrappers genéricos.', compat_notes: null }
        ],
        combos: [
          { comando: 'falla_o_sigue() { "$@" || { echo "Error en: $*"; exit 1; }; }; falla_o_sigue cp src dst', explicacion: 'Función wrapper que ejecuta lo que le pases y aborta con mensaje si falla.', compat_notes: null },
          { comando: 'usage() { cat <<EOF\nUso: $0 [-h] ARCHIVO\nEOF\nexit 1; }', explicacion: 'Función + here-doc para mostrar ayuda.', compat_notes: null }
        ],
        gotchas: [
          '`return N` define EXIT CODE (0-255). NO es como en otros lenguajes — no puedes "return $variable" para pasar un string. Para eso, `echo "$valor"` + capturar con $(funcion).',
          'Variables sin `local` son GLOBALES. Una función que hace `i=0` machaca cualquier `$i` del scope que la llama.',
          'Sin redefinir `$@` al entrar a una función, los `$1`, `$2`... DENTRO de la función son los ARGUMENTOS DE LA FUNCIÓN, no los del script. Para acceder a los del script desde dentro, pasarlos explícitamente.',
          'Funciones no exportan al entorno como variables: una función definida en un script NO es visible en un subshell salvo `export -f nombre`.',

          { comando: 'echo "Primero: $1, segundo: $2"',     explicacion: 'Argumentos individuales (base 1, no 0).',                                                  compat_notes: null },

          { comando: 'cmd_que_falla; echo "salió con $?"',  explicacion: '$? = exit code del último comando. Capturar INMEDIATAMENTE — cualquier comando posterior lo machaca.', compat_notes: null },

        ],
        combos: [
          { comando: 'set -- a "b c" d; echo "$@" | tr " " "\\n"; echo "---"; echo "$*"', explicacion: '`set -- ...` re-establece $1, $2... Vista contrastada: $@ preserva las palabras, $* las junta.', compat_notes: null },
          { comando: 'cmd; rc=$?; if [ "$rc" -ne 0 ]; then echo "falló con $rc"; fi', explicacion: 'Guardar $? inmediatamente en una variable propia para usarlo después de varios comandos.', compat_notes: null }

        gotchas: [
          'La trampa clásica: `"$@"` con comillas dobles = cada argumento como palabra separada (correcto casi siempre). Sin comillas o con `$*`, los argumentos con espacios se rompen.',

          { comando: 'tr a-z A-Z <<< "hola mundo"',                       explicacion: 'Here-string: una línea como stdin. Resultado: HOLA MUNDO. Más limpio que `echo "hola mundo" | tr a-z A-Z`.',     compat_notes: null },

          { comando: 'cat > config.yml <<EOF\nhost: $HOST\nport: $PORT\nEOF',   explicacion: 'Generar archivo de config con variables expandidas. Combina redirección > con here-doc.',                          compat_notes: null }

    // ====== JS: STATE ======
    const state = {
      search: '',
      categoria: 'all',
      dificultad: 'all',
      tipo: 'all',
      gitbashOnly: false
    };

    // ====== JS: FILTER LOGIC ======

    /**
     * Aplica el conjunto de filtros del state al array de comandos.
     * Reglas (spec §5.2):
     * - categoria: las tarjetas SIN categoria (transversales, p.ej. operadores) se muestran SIEMPRE.
     * - tipo: filtra exactamente.
     * - dificultad: filtra exactamente.
     * - gitbashOnly: incluye 'ok' y 'caveats', excluye solo 'no-disponible'.
     * - search: match case-insensitive en nombre, descripcion, tags (si existen).
     */
    function applyFilters(comandos, s) {
      const q = (s.search || '').trim().toLowerCase();
      return comandos.filter(c => {
        if (s.categoria !== 'all') {
          // Las tarjetas SIN categoria son transversales: pasan siempre el filtro temático.
          if (c.categoria != null && c.categoria !== s.categoria) return false;
        }
        if (s.tipo !== 'all' && c.tipo !== s.tipo) return false;
        if (s.dificultad !== 'all' && c.dificultad !== s.dificultad) return false;
        if (s.gitbashOnly && c.gitbash === 'no-disponible') return false;
        if (q) {
          const hay = (c.nombre || '').toLowerCase().includes(q)
                   || (c.descripcion || '').toLowerCase().includes(q)
                   || (c.tags || []).some(t => String(t).toLowerCase().includes(q));
          if (!hay) return false;
        }
        return true;
      });
    }

    // ====== JS: RENDER ======

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderCodeBlock(code, compatNotes) {
      const safe = escapeHtml(code);
      const note = compatNotes
        ? `<p class="text-xs text-amber-700 mt-1">⚠ ${escapeHtml(compatNotes)}</p>`
        : '';
      return `<div class="my-1 relative group">
        <pre class="bg-slate-900 text-slate-100 text-xs rounded px-2 py-1 overflow-x-auto"><code>${safe}</code></pre>
        <button type="button" class="copy-btn absolute top-1 right-1 text-xs bg-slate-700 text-slate-100 px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition" data-copy="${safe}">📋</button>
        ${note}
      </div>`;
    }

    function renderEjemplos(ejemplos) {
      if (!ejemplos || ejemplos.length === 0) return '';
      return `<div class="mt-3">
        <h4 class="text-xs font-semibold uppercase text-slate-500 mb-1">Ejemplos</h4>
        ${ejemplos.map(e => `
          <div class="text-sm">
            ${renderCodeBlock(e.comando, e.compat_notes)}
            <p class="text-slate-700">${escapeHtml(e.explicacion)}</p>
          </div>
        `).join('')}
      </div>`;
    }

    function renderFlags(flags) {
      if (!flags || flags.length === 0) return '';
      return `<div class="mt-3">
        <h4 class="text-xs font-semibold uppercase text-slate-500 mb-1">Flags</h4>
        <ul class="text-sm space-y-1">
          ${flags.map(f => `
            <li>
              <code class="bg-slate-100 px-1 rounded">${escapeHtml(f.flag)}</code>

              ${f.compat_notes ? `<span class="block text-xs text-amber-700">⚠ ${escapeHtml(f.compat_notes)}</span>` : ''}
            </li>
          `).join('')}
        </ul>
      </div>`;
    }

    function renderModeloMental(text) {
      if (!text) return '';
      return `<div class="mt-3 bg-sky-50 border-l-4 border-sky-300 p-2 text-sm">

    function renderCombos(combos) {
      if (!combos || combos.length === 0) return '';

        <h4 class="text-xs font-semibold uppercase text-slate-500 mb-1">Combinaciones</h4>

    function renderTipoBadge(tipo) {
      const map = {
        'comando':  'bg-sky-100 text-sky-800',

      return `<span class="text-xs px-2 py-0.5 rounded-full ${cls}">${escapeHtml(tipo)}</span>`;
    }

    function renderGitbashDot(estado) {
      const map = {
        'ok':            { color: 'bg-emerald-500', title: 'Git Bash: portable 100%' },
        'caveats':       { color: 'bg-amber-500',   title: 'Git Bash: existe con caveats (ver compat_notes en flags/ejemplos)' },
        'no-disponible': { color: 'bg-rose-500',    title: 'Git Bash: no disponible' }
      };
      const m = map[estado] || { color: 'bg-slate-400', title: 'Git Bash: desconocido' };
      return `<span class="inline-block w-3 h-3 rounded-full ${m.color} mt-1.5" title="${m.title}"></span>`;
    }

    function renderEscenario(text) {
      if (!text) return '';
      return `<div class="mt-2 bg-emerald-50 border-l-4 border-emerald-300 p-2 text-sm">

    function renderDesglose(items) {
      if (!items || items.length === 0) return '';
      return `<div class="mt-3">

    function renderCardBody(c) {
      const inner = [
        renderEscenario(c.escenario),
        renderModeloMental(c.modelo_mental),
        renderEjemplos(c.ejemplos),
        renderDesglose(c.desglose),
        renderFlags(c.flags),
        renderCombos(c.combos),
        renderGotchas(c.gotchas),
        renderCuandoNoUsar(c.cuando_no_usar)
      ].join('');

      // Heurística: si la tarjeta es "gorda" (tiene modelo_mental o gotchas o más de 4 flags o es receta), se colapsa.
      const isHeavy = !!c.modelo_mental || (c.gotchas && c.gotchas.length > 0) || (c.flags && c.flags.length > 4) || c.tipo === 'receta';
      if (!isHeavy) return inner;

      return `
        <details class="mt-2">
          <summary class="cursor-pointer text-sm text-sky-700 hover:text-sky-900 select-none">Ver más ▾</summary>
          <div class="mt-2">${inner}</div>
        </details>
      `;
    }

    function renderCard(c) {
      return `
        <article class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm" data-id="${escapeHtml(c.id)}">
          <header class="flex items-start gap-2">
            ${renderGitbashDot(c.gitbash)}
            <h3 class="text-lg font-bold flex-1"><code>${escapeHtml(c.nombre)}</code></h3>
            ${renderTipoBadge(c.tipo)}
          </header>
          ${c.patron ? `<p class="text-xs text-slate-500 font-mono mt-1">${escapeHtml(c.patron)}</p>` : ''}
          <p class="mt-2 text-sm text-slate-700">${escapeHtml(c.descripcion)}</p>
          ${renderCardBody(c)}
        </article>
      `;
    }

    function renderAll() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty-state');
      const filtered = applyFilters(COMANDOS, state);
      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = filtered.map(renderCard).join('');
      }
    }

    // ====== JS: COPY ======

    /**
     * Copia texto al portapapeles. Intenta navigator.clipboard (secure context),
     * cae a document.execCommand('copy') con un <textarea> temporal para entornos file://
     * donde Firefox bloquea la API moderna.
     * Devuelve una Promise<boolean>.
     */
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
      }
      return Promise.resolve(fallbackCopy(text));
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    function flashCopyButton(btn, ok) {
      const original = btn.dataset.original || btn.textContent;
      btn.dataset.original = original;
      btn.textContent = ok ? '✓ copiado' : '✗ no se pudo copiar';
      btn.classList.toggle('text-emerald-700', ok);
      btn.classList.toggle('text-rose-700',  !ok);
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('text-emerald-700', 'text-rose-700');
      }, 1500);
    }

    // ====== JS: WIRE-UP ======

    function wireUp() {
      const search = document.getElementById('search-input');
      const cat    = document.getElementById('filter-categoria');
      const dif    = document.getElementById('filter-dificultad');
      const tip    = document.getElementById('filter-tipo');
      const gb     = document.getElementById('filter-gitbash');
      const clear  = document.getElementById('filter-clear');

      search.addEventListener('input', () => { state.search = search.value; renderAll(); });
      cat.addEventListener('change',   () => { state.categoria   = cat.value; renderAll(); });
      dif.addEventListener('change',   () => { state.dificultad  = dif.value; renderAll(); });
      tip.addEventListener('change',   () => { state.tipo        = tip.value; renderAll(); });
      gb.addEventListener('change',    () => { state.gitbashOnly = gb.checked; renderAll(); });

      clear.addEventListener('click', () => {
        search.value = ''; cat.value = 'all'; dif.value = 'all'; tip.value = 'all'; gb.checked = false;
        state.search = ''; state.categoria = 'all'; state.dificultad = 'all'; state.tipo = 'all'; state.gitbashOnly = false;
        renderAll();
      });

      document.getElementById('empty-state-clear').addEventListener('click', () => {
        document.getElementById('filter-clear').click();
      });

      document.body.addEventListener('click', (ev) => {
        const btn = ev.target.closest('.copy-btn');
        if (!btn) return;
        const text = btn.getAttribute('data-copy') || '';
        // Decodificar entidades HTML que escapamos al render.
        const decoded = new DOMParser().parseFromString(text, 'text/html').documentElement.textContent;
        copyToClipboard(decoded).then(ok => flashCopyButton(btn, ok));
      });
    }

    wireUp();

    // ====== JS: TESTS ======
    (function runTests() {
      assert(true, 'meta — assert true pasa');
      // --- applyFilters ---
      const SAMPLE = [
        { id: 'a', tipo: 'comando',  nombre: 'a', categoria: 'busqueda-archivos', dificultad: 'basico',     descripcion: 'Hola archivo', gitbash: 'ok',            tags: ['arch'] },
        { id: 'b', tipo: 'comando',  nombre: 'b', categoria: 'busqueda-contenido', dificultad: 'intermedio', descripcion: 'busca dentro', gitbash: 'caveats',       tags: ['cont'] },
        { id: 'c', tipo: 'receta',   nombre: 'c', categoria: 'busqueda-contenido', dificultad: 'avanzado',   descripcion: 'una receta',   gitbash: 'no-disponible', tags: [] },
        { id: 'd', tipo: 'operador', nombre: '|', /* sin categoria */              dificultad: 'basico',     descripcion: 'pipe',         gitbash: 'ok',            tags: ['pipe'] },
      ];

      assert(applyFilters(SAMPLE, { search:'', categoria:'all', dificultad:'all', tipo:'all', gitbashOnly:false }).length === 4,
             'applyFilters — sin filtros devuelve todo');
      assert(applyFilters(SAMPLE, { search:'', categoria:'busqueda-archivos', dificultad:'all', tipo:'all', gitbashOnly:false }).length === 2,
             'applyFilters — categoria busqueda-archivos incluye operador transversal');
      assert(applyFilters(SAMPLE, { search:'', categoria:'all', dificultad:'all', tipo:'comando', gitbashOnly:false }).length === 2,
             'applyFilters — tipo comando');
      assert(applyFilters(SAMPLE, { search:'', categoria:'all', dificultad:'basico', tipo:'all', gitbashOnly:false }).length === 2,
             'applyFilters — dificultad basico');
      assert(applyFilters(SAMPLE, { search:'', categoria:'all', dificultad:'all', tipo:'all', gitbashOnly:true }).length === 3,
             'applyFilters — gitbashOnly excluye solo no-disponible');
      assert(applyFilters(SAMPLE, { search:'pipe', categoria:'all', dificultad:'all', tipo:'all', gitbashOnly:false }).length === 1,
             'applyFilters — search en descripcion');
      assert(applyFilters(SAMPLE, { search:'cont', categoria:'all', dificultad:'all', tipo:'all', gitbashOnly:false }).length === 1,
             'applyFilters — search en tags');
      assert(applyFilters(SAMPLE, { search:'', categoria:'busqueda-contenido', dificultad:'all', tipo:'all', gitbashOnly:false }).length === 3,
             'applyFilters — categoria filtra Y mantiene operador transversal');

      // --- renderCard ---
      const cardHtml = renderCard(SAMPLE[0]);
      assert(cardHtml.includes('<article'), 'renderCard — devuelve un article');
      assert(cardHtml.includes('data-id="a"'), 'renderCard — incluye data-id');
      assert(cardHtml.includes('Hola archivo'), 'renderCard — incluye descripcion');
      // No debe romperse con campos opcionales ausentes
      assert(typeof renderCard({ id:'x', tipo:'comando', nombre:'x', categoria:'busqueda-archivos', dificultad:'basico', descripcion:'min', gitbash:'ok' }) === 'string',
             'renderCard — funciona con solo obligatorios');

      // --- renderCard escaping (defensa contra XSS, regresión de escapeHtml) ---
      const xssCard = renderCard({
        id: 'x',
        tipo: 'comando',
        nombre: '<script>',
        categoria: 'busqueda-archivos',
        dificultad: 'basico',
        descripcion: 'a"b<c',
        gitbash: 'ok'
      });
      assert(!xssCard.includes('<script>') && xssCard.includes('&lt;script&gt;'),
             'renderCard — escapa nombre');
      assert(xssCard.includes('a&quot;b&lt;c'),
             'renderCard — escapa descripcion');

      // --- render initial ---
      renderAll();

      renderTestBanner();
    })();
  </script>
